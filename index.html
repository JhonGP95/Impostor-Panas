<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Impostor">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<meta name="description" content="El Impostor Chazey Panas - Juego de roles para grupos">
<title>El Impostor · Chazey Panas</title>

<!-- Manifest mínimo de respaldo; el manifest completo (con íconos generados) se inyecta al iniciar -->
<link rel="manifest" id="manifest-link" href="data:application/manifest+json,%7B%22name%22%3A%22El%20Impostor%20Chazey%20Panas%22%2C%22short_name%22%3A%22Impostor%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23000000%22%2C%22theme_color%22%3A%22%23000000%22%7D">

<style>
/* ================================================================
   VARIABLES & RESET
   ================================================================ */
:root {
  --green:    #39FF14;
  --red:      #FF3131;
  --blue:     #4D9FFF;
  --violet:   #A855F7;
  --cyan:     #00F5FF;
  --yellow:   #FFD600;
  --orange:   #FF6B35;
  --bg:       #000000;
  --surface:  #0A0A0F;
  --surface2: #111118;
  --border:   rgba(255,255,255,0.08);
  --text:     #F0F0FF;
  --muted:    rgba(240,240,255,0.45);
  --safe-top: env(safe-area-inset-top, 44px);
  --safe-bot: env(safe-area-inset-bottom, 20px);
  --radius:   16px;
  --radius-sm:10px;
  --font:     'SF Pro Display', -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif;
  --trans:    0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0; padding: 0;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

#app {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
}

/* ================================================================
   SCREENS
   ================================================================ */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  padding-top: max(44px, var(--safe-top));
  padding-bottom: max(20px, var(--safe-bot));
  background: var(--bg);
  opacity: 0;
  pointer-events: none;
  transform: translateX(100%);
  transition: opacity var(--trans), transform var(--trans);
  overflow: hidden;
}

.screen.active {
  opacity: 1;
  pointer-events: all;
  transform: translateX(0);
}

.screen.exit-left {
  opacity: 0;
  transform: translateX(-40%);
  pointer-events: none;
}

.scroll-area {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 0 20px;
  scrollbar-width: none;
}
.scroll-area::-webkit-scrollbar { display: none; }

.screen-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: 16px 20px 20px;
  flex-shrink: 0;
}

.screen-footer {
  padding: 16px 20px max(16px, var(--safe-bot));
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* ================================================================
   TIPOGRAFÍA
   ================================================================ */
.title-xl { font-size: 34px; font-weight: 800; line-height: 1.1; }
.title-lg { font-size: 26px; font-weight: 800; line-height: 1.15; }
.title-md { font-size: 19px; font-weight: 700; line-height: 1.2; }
.body-md  { font-size: 15px; line-height: 1.45; }
.caption  { font-size: 12.5px; color: var(--muted); line-height: 1.4; }

.glow-violet { color: var(--violet); text-shadow: 0 0 24px rgba(168,85,247,0.5); }
.glow-red    { color: var(--red);    text-shadow: 0 0 24px rgba(255,49,49,0.5); }
.glow-green  { color: var(--green);  text-shadow: 0 0 24px rgba(57,255,20,0.45); }
.glow-cyan   { color: var(--cyan);   text-shadow: 0 0 24px rgba(0,245,255,0.5); }
.glow-yellow { color: var(--yellow); text-shadow: 0 0 24px rgba(255,214,0,0.5); }

/* ================================================================
   BOTONES
   ================================================================ */
.btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 16px 20px;
  border: none;
  border-radius: var(--radius);
  font-family: var(--font);
  font-size: 16px;
  font-weight: 700;
  color: #fff;
  cursor: pointer;
  transition: transform 0.15s, opacity 0.2s, box-shadow 0.2s;
  user-select: none;
}
.btn:active { transform: scale(0.97); }

.btn-primary {
  background: linear-gradient(135deg, var(--violet), #7C3AED);
  box-shadow: 0 8px 28px rgba(168,85,247,0.35);
}
.btn-red {
  background: linear-gradient(135deg, var(--red), #B91C1C);
  box-shadow: 0 8px 28px rgba(255,49,49,0.3);
}
.btn-green {
  background: linear-gradient(135deg, var(--green), #16A34A);
  box-shadow: 0 8px 28px rgba(57,255,20,0.3);
  color: #03210b;
}
.btn-ghost {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
}
.btn-sm { padding: 10px 16px; font-size: 13.5px; border-radius: var(--radius-sm); }

.btn-danger-ghost {
  background: rgba(255,49,49,0.07);
  border: 1px solid rgba(255,49,49,0.3);
  color: rgba(255,120,120,0.9);
}

.btn-hold {
  position: relative;
  z-index: 1;
  background: var(--surface2);
  border: 2px solid rgba(168,85,247,0.5);
  color: var(--text);
  padding: 18px 20px;
  font-size: 16px;
}

.icon-btn {
  width: 42px; height: 42px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 50%;
  font-size: 19px;
  cursor: pointer;
  transition: transform 0.15s, opacity 0.2s;
}
.icon-btn:active { transform: scale(0.9); }

/* Fila de controles rápidos (partida en curso) */
.controls-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
}
.controls-row .btn { width: auto; flex: 1 1 auto; white-space: nowrap; }

/* ================================================================
   TARJETAS & SECCIONES
   ================================================================ */
.card-glass {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
}

.form-group { margin-bottom: 22px; }
.form-label {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.04em;
  margin-bottom: 12px;
  color: var(--text);
}

.section-label {
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 18px 0 10px;
}

.divider { height: 1px; background: var(--border); margin: 16px 0; }

/* ================================================================
   STEPPER
   ================================================================ */
.stepper {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 6px;
}
.stepper-btn {
  width: 48px; height: 44px;
  border: none;
  border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.06);
  color: var(--text);
  font-size: 24px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
}
.stepper-btn:active { transform: scale(0.92); background: rgba(168,85,247,0.25); }
.stepper-val {
  font-size: 24px;
  font-weight: 800;
  min-width: 64px;
  text-align: center;
}
.stepper.disabled { opacity: 0.4; pointer-events: none; }

/* ================================================================
   SWITCH
   ================================================================ */
.switch-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 0;
  min-height: 44px;
}
.switch {
  position: relative;
  display: inline-block;
  width: 52px; height: 30px;
  flex-shrink: 0;
}
.switch input { opacity: 0; width: 0; height: 0; }
.switch-track {
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.12);
  border-radius: 30px;
  transition: background 0.25s;
  cursor: pointer;
}
.switch-track::before {
  content: '';
  position: absolute;
  width: 24px; height: 24px;
  left: 3px; top: 3px;
  background: #fff;
  border-radius: 50%;
  transition: transform 0.25s;
}
.switch input:checked + .switch-track { background: var(--violet); }
.switch input:checked + .switch-track::before { transform: translateX(22px); }

/* ================================================================
   TOGGLE GROUP (segmented)
   ================================================================ */
.toggle-group {
  display: flex;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 4px;
  gap: 4px;
}
.toggle-option {
  flex: 1;
  padding: 12px 8px;
  border: none;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--muted);
  font-family: var(--font);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
}
.toggle-option.active {
  background: rgba(168,85,247,0.25);
  color: var(--text);
}

/* ================================================================
   LISTA DE JUGADORES (config)
   ================================================================ */
.player-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
}
.player-avatar {
  width: 40px; height: 40px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  font-size: 19px;
}
.player-input {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  font-weight: 600;
}
.player-input::placeholder { color: var(--muted); }
.player-move-btns { display: flex; flex-direction: column; gap: 2px; }
.player-move-btn {
  width: 30px; height: 22px;
  border: none;
  border-radius: 6px;
  background: rgba(255,255,255,0.06);
  color: var(--muted);
  font-size: 13px;
  cursor: pointer;
  line-height: 1;
}
.player-move-btn:active { background: rgba(168,85,247,0.3); color: #fff; }
.player-move-btn.disabled { opacity: 0.25; pointer-events: none; }

/* ================================================================
   CHIPS & BADGES
   ================================================================ */
.stat-chips {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  padding: 0 20px 12px;
  flex-shrink: 0;
}
.stat-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 700;
  background: var(--surface2);
  border: 1px solid var(--border);
}
.stat-chip-red   { background: rgba(255,49,49,0.1);  border-color: rgba(255,49,49,0.3);  color: var(--red); }
.stat-chip-blue  { background: rgba(77,159,255,0.1); border-color: rgba(77,159,255,0.3); color: var(--blue); }
.stat-chip-green { background: rgba(57,255,20,0.1);  border-color: rgba(57,255,20,0.3);  color: var(--green); }
.stat-chip-cyan  { background: rgba(0,245,255,0.1);  border-color: rgba(0,245,255,0.3);  color: var(--cyan); }
.stat-chip-violet{ background: rgba(168,85,247,0.12);border-color: rgba(168,85,247,0.35);color: var(--violet); }

.badge {
  display: inline-flex;
  align-items: center;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--muted);
  white-space: nowrap;
}
.badge-impostor {
  background: rgba(255,49,49,0.15);
  border-color: rgba(255,49,49,0.4);
  color: var(--red);
}
.badge-human {
  background: rgba(57,255,20,0.15);
  border-color: rgba(57,255,20,0.4);
  color: var(--green);
}
.badge-undercover {
  background: rgba(0,245,255,0.15);
  border-color: rgba(0,245,255,0.4);
  color: var(--cyan);
}
.badge-left {
  background: rgba(255,255,255,0.06);
  border-color: var(--border);
  color: var(--muted);
}

/* ================================================================
   VOTACIÓN
   ================================================================ */
.vote-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 14px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
}

/* ================================================================
   PODERES
   ================================================================ */
.power-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 10px;
}
.power-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 6px;
}
.power-name {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 15px;
  font-weight: 700;
}
.power-desc {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.5;
}
.btn-power {
  border: 1px solid rgba(255,214,0,0.4);
  background: rgba(255,214,0,0.08);
  color: var(--yellow);
}
.btn-power:active { transform: scale(0.97); }
.btn-power.btn-shield {
  border-color: rgba(77,159,255,0.4);
  background: rgba(77,159,255,0.08);
  color: var(--blue);
}
.btn-power.btn-oracle {
  border-color: rgba(168,85,247,0.4);
  background: rgba(168,85,247,0.08);
  color: var(--violet);
}

/* ================================================================
   MODAL
   ================================================================ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal-card {
  width: 100%;
  max-width: 420px;
  max-height: 82vh;
  overflow-y: auto;
  background: var(--surface);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 24px 20px;
  transform: translateY(24px) scale(0.97);
  transition: transform 0.25s;
  scrollbar-width: none;
}
.modal-card::-webkit-scrollbar { display: none; }
.modal-overlay.open .modal-card { transform: translateY(0) scale(1); }

.pick-item {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 12px 14px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  text-align: left;
  transition: background 0.15s;
}
.pick-item:active { background: rgba(168,85,247,0.2); }

/* ================================================================
   ROLE CARD (revelar)
   ================================================================ */
.role-card {
  padding: 28px 20px;
  border-radius: 20px;
  text-align: center;
  background: linear-gradient(160deg, #0a0020 0%, #001520 50%, #000000 100%);
  border: 2px solid var(--border);
}
.role-card-impostor {
  border-color: rgba(255,49,49,0.5);
  box-shadow: 0 0 60px rgba(255,49,49,0.15), inset 0 0 60px rgba(255,49,49,0.03);
}
.role-card-human {
  border-color: rgba(57,255,20,0.45);
  box-shadow: 0 0 60px rgba(57,255,20,0.12), inset 0 0 60px rgba(57,255,20,0.03);
}

/* ================================================================
   ANIMACIONES
   ================================================================ */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes scaleIn {
  from { opacity: 0; transform: scale(0.8); }
  to   { opacity: 1; transform: scale(1); }
}
@keyframes pulse-green {
  0%, 100% { opacity: 0.4; transform: scale(1); }
  50%      { opacity: 1; transform: scale(1.3); }
}
@keyframes float-up {
  from { transform: translateY(110vh); opacity: 0.8; }
  to   { transform: translateY(-10vh); opacity: 0; }
}
@keyframes pulse-red {
  0%, 100% { box-shadow: 0 0 40px rgba(255,49,49,0.15); }
  50%      { box-shadow: 0 0 70px rgba(255,49,49,0.35); }
}
@keyframes pulse-glow-green {
  0%, 100% { box-shadow: 0 0 40px rgba(57,255,20,0.12); }
  50%      { box-shadow: 0 0 70px rgba(57,255,20,0.3); }
}
@keyframes glitch {
  0%, 89%, 100% { transform: translate(0,0); }
  90% { transform: translate(-2px,1px); }
  92% { transform: translate(2px,-1px); }
  94% { transform: translate(-1px,-1px); }
  96% { transform: translate(1px,1px); }
}
@keyframes explosion {
  0%   { opacity: 0; }
  10%  { opacity: 1; }
  100% { opacity: 0; }
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(6px); }
}
@keyframes roll-in {
  from { opacity: 0; transform: scale(0.5) rotate(-12deg); }
  to   { opacity: 1; transform: scale(1) rotate(0); }
}

.anim-fade-up { animation: fadeUp 0.5s cubic-bezier(0.2,0.8,0.3,1) both; }
.anim-scale   { animation: scaleIn 0.45s cubic-bezier(0.2,0.8,0.3,1) both; }
.anim-fade    { animation: fadeUp 0.6s ease both; }
.delay-1 { animation-delay: 0.12s; }
.delay-2 { animation-delay: 0.24s; }
.delay-3 { animation-delay: 0.36s; }
.delay-4 { animation-delay: 0.48s; }

/* ================================================================
   VICTORY SCREEN
   ================================================================ */
.victory-bg {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}
.victory-particle {
  position: absolute;
  top: 0;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  animation: float-up linear infinite;
}

/* ================================================================
   HOLD BUTTON PROGRESS
   ================================================================ */
.hold-container {
  position: relative;
  user-select: none;
}
.hold-progress {
  position: absolute;
  inset: 0;
  border-radius: var(--radius);
  overflow: hidden;
  pointer-events: none;
}
.hold-fill {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 0%;
  background: linear-gradient(90deg, var(--violet), var(--cyan));
  opacity: 0.3;
  transition: width 0.05s linear;
}

/* ================================================================
   OTROS
   ================================================================ */
.scanlines {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.08) 2px,
    rgba(0,0,0,0.08) 4px
  );
}

.sound-toggle {
  position: fixed;
  top: max(12px, var(--safe-top));
  right: 16px;
  z-index: 100;
  width: 40px;
  height: 40px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 18px;
  transition: all 0.2s;
}
.sound-toggle:active { transform: scale(0.9); }
.sound-toggle.muted { opacity: 0.5; }

.explosion-flash {
  position: fixed;
  inset: 0;
  z-index: 2000;
  pointer-events: none;
  background: radial-gradient(circle, rgba(255,214,0,0.9), rgba(255,107,53,0.7) 40%, rgba(0,0,0,0) 75%);
  animation: explosion 0.8s ease-out both;
}
.shake { animation: shake 0.5s ease; }

.info-note {
  font-size: 12.5px;
  color: var(--muted);
  line-height: 1.5;
  padding: 12px 14px;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
}
</style>
</head>
<body>

<div class="scanlines"></div>
<button class="sound-toggle" id="sound-toggle" onclick="toggleSound()">🔊</button>
<div id="app"></div>

<!-- MODAL GLOBAL -->
<div id="modal" class="modal-overlay" onclick="closeModalOnBg(event)">
  <div class="modal-card" id="modal-content" onclick="event.stopPropagation()"></div>
</div>

<script>
/* ================================================================
   WEB AUDIO API - SISTEMA DE SONIDOS
   ================================================================ */
let audioCtx = null;
let soundEnabled = true;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  const btn = document.getElementById('sound-toggle');
  btn.textContent = soundEnabled ? '🔊' : '🔇';
  btn.classList.toggle('muted', !soundEnabled);
}

function playTone(frequency, duration, type = 'sine', volume = 0.2) {
  if (!audioCtx || audioCtx.state !== 'running') return;

  const oscillator = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();

  oscillator.type = type;
  oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime);

  gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);
  gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

  oscillator.connect(gainNode);
  gainNode.connect(audioCtx.destination);

  oscillator.start(audioCtx.currentTime);
  oscillator.stop(audioCtx.currentTime + duration);
}

function playSound(type) {
  if (!soundEnabled) return;
  initAudio();
  if (!audioCtx) return;

  switch(type) {
    case 'tap':
      playTone(800, 0.1, 'sine', 0.15);
      break;
    case 'hold':
      playTone(400, 0.15, 'sine', 0.1);
      break;
    case 'reveal':
      playTone(523, 0.15, 'sine', 0.25);
      setTimeout(() => playTone(659, 0.15, 'sine', 0.25), 100);
      setTimeout(() => playTone(784, 0.25, 'sine', 0.3), 200);
      break;
    case 'victory':
      playTone(523, 0.15, 'sine', 0.3);
      setTimeout(() => playTone(659, 0.15, 'sine', 0.3), 150);
      setTimeout(() => playTone(784, 0.15, 'sine', 0.3), 300);
      setTimeout(() => playTone(1047, 0.4, 'sine', 0.35), 450);
      break;
    case 'eliminate':
      playTone(200, 0.1, 'square', 0.2);
      setTimeout(() => playTone(150, 0.2, 'square', 0.15), 100);
      setTimeout(() => playTone(100, 0.3, 'square', 0.1), 250);
      break;
    case 'whoosh':
      playTone(300, 0.15, 'sine', 0.08);
      setTimeout(() => playTone(400, 0.1, 'sine', 0.05), 50);
      break;
    case 'start':
      playTone(440, 0.1, 'sine', 0.2);
      setTimeout(() => playTone(554, 0.1, 'sine', 0.2), 100);
      setTimeout(() => playTone(659, 0.15, 'sine', 0.25), 200);
      setTimeout(() => playTone(880, 0.2, 'sine', 0.3), 300);
      break;
    case 'impostorWin':
      playTone(150, 0.4, 'sawtooth', 0.15);
      setTimeout(() => playTone(200, 0.3, 'sawtooth', 0.12), 300);
      setTimeout(() => playTone(250, 0.5, 'sawtooth', 0.1), 500);
      break;
    case 'explosion':
      playTone(90, 0.5, 'sawtooth', 0.4);
      playTone(60, 0.7, 'square', 0.3);
      setTimeout(() => playTone(45, 0.6, 'sawtooth', 0.25), 120);
      break;
    case 'shield':
      playTone(660, 0.12, 'sine', 0.2);
      setTimeout(() => playTone(880, 0.2, 'sine', 0.25), 90);
      break;
    case 'oracle':
      playTone(740, 0.18, 'sine', 0.18);
      setTimeout(() => playTone(554, 0.25, 'sine', 0.18), 140);
      setTimeout(() => playTone(880, 0.3, 'sine', 0.2), 300);
      break;
  }
}

const SW_SOURCE =
  "const CACHE='el-impostor-v3';" +
  "const ASSETS=['./','./index.html'];" +
  "self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS)).then(()=>self.skipWaiting()))});" +
  "self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()))});" +
  "self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{if(res.ok&&res.type==='basic'){const cp=res.clone();caches.open(CACHE).then(c=>c.put(e.request,cp));}return res;}).catch(()=>caches.match('./index.html'))))});";

function generatePwaIcon(size, maskable) {
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  if (!ctx) return null;

  const g = ctx.createRadialGradient(size/2, size*0.42, size*0.05, size/2, size/2, size*0.8);
  g.addColorStop(0, '#26043c');
  g.addColorStop(0.55, '#0a0014');
  g.addColorStop(1, '#000000');
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);

  const ringR = size * (maskable ? 0.34 : 0.40);
  ctx.strokeStyle = 'rgba(168,85,247,0.95)';
  ctx.lineWidth = size * 0.035;
  ctx.beginPath();
  ctx.arc(size/2, size/2, ringR, 0, Math.PI * 2);
  ctx.stroke();

  ctx.strokeStyle = 'rgba(0,245,255,0.55)';
  ctx.lineWidth = size * 0.016;
  ctx.beginPath();
  ctx.arc(size/2, size/2, ringR * 1.13, 0, Math.PI * 2);
  ctx.stroke();

  ctx.font = Math.round(size * (maskable ? 0.38 : 0.44)) + 'px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('👁️', size/2, size/2 + size*0.01);

  try { return c.toDataURL('image/png'); } catch(e) { return null; }
}

function setupPwaManifest() {
  try {
    const startUrl = location.href.split('#')[0];
    const scope = startUrl.replace(/[^/]*$/, '');
    const icon192 = generatePwaIcon(192, false);
    const icon512 = generatePwaIcon(512, false);
    const iconMask = generatePwaIcon(512, true);

    const manifest = {
      name: 'El Impostor · Chazey Panas',
      short_name: 'Impostor',
      description: 'Juego de fiesta: encontrá al impostor con la palabra secreta.',
      start_url: startUrl,
      scope: scope,
      display: 'standalone',
      orientation: 'portrait',
      background_color: '#000000',
      theme_color: '#000000',
      icons: []
    };
    if (icon192) manifest.icons.push({ src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any' });
    if (icon512) manifest.icons.push({ src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any' });
    if (iconMask) manifest.icons.push({ src: iconMask, sizes: '512x512', type: 'image/png', purpose: 'maskable' });

    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    const link = document.getElementById('manifest-link');
    if (link) link.href = URL.createObjectURL(blob);
  } catch(e) {}
}

function downloadSw() {
  try {
    const blob = new Blob([SW_SOURCE], { type: 'text/javascript' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sw.js';
    document.body.appendChild(a);
    a.click();
    a.remove();
  } catch(e) {}
}

function tryRegisterServiceWorker() {
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return;
  fetch('sw.js', { method: 'HEAD' })
    .then(r => {
      if (r.ok && (r.headers.get('content-type') || '').toLowerCase().includes('javascript')) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }
    })
    .catch(() => {});
}

   ================================================================ */
const $ = id => document.getElementById(id);
const rand = arr => arr[Math.floor(Math.random() * arr.length)];
const randInt = n => Math.floor(Math.random() * n);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = randInt(i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickRandom(arr, k) {
  return shuffle(arr).slice(0, Math.max(0, Math.min(k, arr.length)));
}

function wordPool() {
  const selected = STATE.config.selectedCategories || [];
  let cats = selected.length > 0
    ? BASE_DE_DATOS.filter(c => selected.includes(c.categoria))
    : BASE_DE_DATOS;
  if (cats.length === 0) cats = BASE_DE_DATOS;
  return cats.flatMap(c => c.palabras);
}

function saveToStorage() {
  try {
    localStorage.setItem('chazey_config_v3', JSON.stringify({
      numPlayers:       STATE.config.numPlayers,
      numImpostors:     STATE.config.numImpostors,
      randomImpostors:  STATE.config.randomImpostors,
      numUndercovers:   STATE.config.numUndercovers,
      numBullets:       STATE.config.numBullets,
      infiniteBullets:  STATE.config.infiniteBullets,
      withHints:        STATE.config.withHints,
      selectedCategories: STATE.config.selectedCategories,
      playerNames:      STATE.config.playerNames,
      powers:           STATE.config.powers
    }));
  } catch(e) {}
}

function loadFromStorage() {
  try {
    const saved = localStorage.getItem('chazey_config_v3');
    if (saved) {
      const d = JSON.parse(saved);
      const powers = d.powers;
      delete d.powers;
      Object.assign(STATE.config, d);
      if (powers && typeof powers === 'object') {
        STATE.config.powers = Object.assign(STATE.config.powers, powers);
      }
      if (!Array.isArray(STATE.config.selectedCategories)) STATE.config.selectedCategories = [];
      if (!Array.isArray(STATE.config.playerNames)) STATE.config.playerNames = [];
      if (!STATE.config.powers || typeof STATE.config.powers !== 'object') {
        STATE.config.powers = { grenade: false, shield: false, oracle: false };
      }
    }
  } catch(e) {}
}

/* ================================================================
   NAVEGACIÓN SPA
   ================================================================ */
function navigate(toId, back = false) {
  const next = $(toId);
  if (!next) return;

  // Salir siempre desde la pantalla que la SPA considera actual (no un querySelector,
  // que puede devolver una pantalla equivocada si dos quedaron activas)
  const prevId = STATE.currentScreen;
  const current = (prevId && prevId !== toId) ? $(prevId) : null;

  if (current) {
    current.classList.add('exit-left');
    setTimeout(() => {
      // Solo si sigue en salida (no fue reactivada por otra navegación)
      if (current.classList.contains('exit-left')) {
        current.classList.remove('active', 'exit-left');
      }
    }, 350);
  }

  // Higiene: ninguna otra pantalla debe quedar activa
  document.querySelectorAll('.screen.active').forEach(sc => {
    if (sc !== next && sc !== current) sc.classList.remove('active', 'exit-left');
  });

  requestAnimationFrame(() => {
    next.style.transform = back ? 'translateX(-100%)' : 'translateX(100%)';
    next.classList.remove('exit-left');
    next.classList.add('active');
    requestAnimationFrame(() => {
      next.style.transition = '';
      next.style.transform = '';
    });
  });

  STATE.currentScreen = toId;
  playSound('whoosh');
}

  return Math.max(1, n - 1); // caos permitido: hasta n-1 impostores

  const imp = STATE.config.randomImpostors ? 1 : STATE.config.numImpostors;

}

function updateConfigDisplays() {
  const p = STATE.config;
  const dp = $('display-players');
  const di = $('display-impostors');
  const du = $('display-undercovers');
  const db = $('display-bullets');
  if (dp) dp.textContent = p.numPlayers;
  if (di) di.textContent = p.randomImpostors ? '🎲' : p.numImpostors;
  if (du) du.textContent = p.numUndercovers;
  if (db) db.textContent = p.infiniteBullets ? '∞' : p.numBullets;

  const si = $('stepper-impostors');
  if (si) si.classList.toggle('disabled', p.randomImpostors);

  const sd = $('uc-desc');
  if (sd) sd.style.display = p.numUndercovers > 0 ? '' : 'none';
}

function rebuildPlayerList() {
  const list = $('player-names-list');
  if (!list) return;
  const n = STATE.config.numPlayers;
  let html = '';
  for (let i = 0; i < n; i++) {
    const name = STATE.config.playerNames[i] || `Jugador ${i + 1}`;
    const canUp = i > 0;
    const canDown = i < n - 1;
    html += `
    <div class="player-item" data-index="${i}">
      <div class="player-avatar" style="background:${colorOf(i)}22;color:${colorOf(i)};font-size:20px;">${avatarOf(i)}</div>
      <input class="player-input" type="text" value="${esc(name)}" maxlength="18" placeholder="Jugador ${i + 1}"
        oninput="updatePlayerName(${i}, this.value)">
      <div class="player-move-btns">
        <button class="player-move-btn ${canUp ? '' : 'disabled'}" onclick="movePlayer(${i}, -1)" ${canUp ? '' : 'disabled'}>↑</button>
        <button class="player-move-btn ${canDown ? '' : 'disabled'}" onclick="movePlayer(${i}, 1)" ${canDown ? '' : 'disabled'}>↓</button>
      </div>
    </div>`;
  }
  list.innerHTML = html;
}

function syncConfigUI() {
  updateConfigDisplays();
  rebuildPlayerList();

  const h = $('mode-hints');
  const nh = $('mode-nohints');
  if (h) h.classList.toggle('active', STATE.config.withHints);
  if (nh) nh.classList.toggle('active', !STATE.config.withHints);

  const inf = $('toggle-infinite');
  if (inf) inf.checked = STATE.config.infiniteBullets;
  const sb = $('stepper-bullets');
  if (sb) {
    sb.style.opacity = STATE.config.infiniteBullets ? '0.4' : '1';
    sb.style.pointerEvents = STATE.config.infiniteBullets ? 'none' : '';
  }

  const rimp = $('toggle-random-imp');
  if (rimp) rimp.checked = STATE.config.randomImpostors;

  document.querySelectorAll('#cat-checkboxes input[type="checkbox"]').forEach(input => {
    input.checked = (STATE.config.selectedCategories || []).includes(input.value);
  });
  const allBtn = $('toggle-all-cats');
  if (allBtn) allBtn.checked = (STATE.config.selectedCategories || []).length === BASE_DE_DATOS.length;

  Object.keys(POWERS_INFO).forEach(key => {
    const cb = $('power-' + key);
    if (cb) cb.checked = !!STATE.config.powers[key];
  });
}

/* ---- Handlers de configuración ---- */

function stepPlayers(d) {
  const n = Math.min(MAX_PLAYERS, Math.max(MIN_PLAYERS, STATE.config.numPlayers + d));
  STATE.config.numPlayers = n;
  if (!STATE.config.randomImpostors) {
    STATE.config.numImpostors = Math.min(STATE.config.numImpostors, maxImpostorsFor(n));
  }
  STATE.config.numUndercovers = Math.min(STATE.config.numUndercovers, maxUndercoversFor(n));
  updateConfigDisplays();
  rebuildPlayerList();
  playSound('tap');
}

function stepImpostors(d) {
  if (STATE.config.randomImpostors) return;
  STATE.config.numImpostors = Math.min(maxImpostorsFor(STATE.config.numPlayers), Math.max(1, STATE.config.numImpostors + d));
  STATE.config.numUndercovers = Math.min(STATE.config.numUndercovers, maxUndercoversFor(STATE.config.numPlayers));
  updateConfigDisplays();
  playSound('tap');
}

function toggleRandomImpostors(cb) {
  STATE.config.randomImpostors = cb.checked;
  updateConfigDisplays();
  playSound('tap');
}

function stepUndercovers(d) {
  STATE.config.numUndercovers = Math.min(maxUndercoversFor(STATE.config.numPlayers), Math.max(0, STATE.config.numUndercovers + d));
  updateConfigDisplays();
  playSound('tap');
}

function stepBullets(d) {
  STATE.config.numBullets = Math.min(20, Math.max(1, STATE.config.numBullets + d));
  updateConfigDisplays();
  playSound('tap');
}

function toggleInfinite(cb) {
  STATE.config.infiniteBullets = cb.checked;
  const stepper = $('stepper-bullets');
  if (stepper) {
    stepper.style.opacity = cb.checked ? '0.4' : '1';
    stepper.style.pointerEvents = cb.checked ? 'none' : '';
  }
  updateConfigDisplays();
  playSound('tap');
}

function setPower(key, checked) {
  STATE.config.powers[key] = checked;
  playSound('tap');
}

function setHints(withHints) {
  STATE.config.withHints = withHints;
  const h = $('mode-hints');
  const nh = $('mode-nohints');
  if (h) h.classList.toggle('active', withHints);
  if (nh) nh.classList.toggle('active', !withHints);
  playSound('tap');
}

function movePlayer(index, direction) {
  const newIndex = index + direction;
  if (newIndex < 0 || newIndex >= STATE.config.numPlayers) return;
  const names = STATE.config.playerNames;
  const temp = names[index];
  names[index] = names[newIndex];
  names[newIndex] = temp;
  playSound('tap');
  rebuildPlayerList();
}

function updatePlayerName(i, val) {
  STATE.config.playerNames[i] = val;
}

function toggleCategory(cat) {
  let sel = STATE.config.selectedCategories || [];
  const idx = sel.indexOf(cat);
  if (idx === -1) sel.push(cat);
  else sel.splice(idx, 1);
  STATE.config.selectedCategories = sel;

  document.querySelectorAll('#cat-checkboxes input[type="checkbox"]').forEach(input => {
    input.checked = STATE.config.selectedCategories.includes(input.value);
  });
  const allBtn = $('toggle-all-cats');
  if (allBtn) allBtn.checked = sel.length === BASE_DE_DATOS.length;
  playSound('tap');
}

function toggleAllCategories() {
  const allChecked = (STATE.config.selectedCategories || []).length === BASE_DE_DATOS.length;
  STATE.config.selectedCategories = allChecked ? [] : BASE_DE_DATOS.map(c => c.categoria);

  document.querySelectorAll('#cat-checkboxes input[type="checkbox"]').forEach(input => {
    input.checked = STATE.config.selectedCategories.includes(input.value);
  });
  const allBtn = $('toggle-all-cats');
  if (allBtn) allBtn.checked = !allChecked;
  playSound('tap');
}

// Peso de repetir como impostor: 0.35 ≈ 3 veces menos probable que el resto
const IMPOSTOR_COOLDOWN_WEIGHT = 0.35;

function loadLastImpostors() {
  try {
    return JSON.parse(localStorage.getItem('chazey_last_impostors') || '[]');
  } catch(e) { return []; }
}

function saveLastImpostors(players) {
  try {
    localStorage.setItem('chazey_last_impostors', JSON.stringify(
      players.filter(pl => pl.isImpostor).map(pl => pl.name.trim().toLowerCase())
    ));
  } catch(e) {}
}

// Sorteo con peso y sin reemplazo: peso 1 para todos, 0.35 para quien
// fue impostor en la ronda anterior (identificado por su nombre).
function pickImpostorsBalanced(n, numImp, lastImpostors, names) {
  const lastSet = new Set((lastImpostors || []).map(s => String(s).trim().toLowerCase()));
  let pool = [...Array(n).keys()].map(i => {
    const nm = String(names[i] || '').trim().toLowerCase();
    return { i, w: lastSet.has(nm) ? IMPOSTOR_COOLDOWN_WEIGHT : 1 };
  });
  const picked = [];
  while (picked.length < numImp && pool.length > 0) {
    const total = pool.reduce((a, e) => a + e.w, 0);
    let r = Math.random() * total;
    let chosen = pool[pool.length - 1];
    for (const e of pool) { r -= e.w; if (r <= 0) { chosen = e; break; } }
    picked.push(chosen.i);
    pool = pool.filter(e => e !== chosen);
  }
  return picked;
}

function startGame() {
  const cfg = STATE.config;

  for (let i = 0; i < cfg.numPlayers; i++) {
    const input = $(`player-name-${i}`);
    if (input && input.value) cfg.playerNames[i] = input.value;
  }

  const n = cfg.numPlayers;

  // Cantidad de impostores: fija o aleatoria (siempre dejando lugar a los undercovers)
  const ucWanted = Math.min(cfg.numUndercovers, n - 2);
  let numImp;
  if (cfg.randomImpostors) {
    const R = Math.max(1, Math.min(n - 1, n - ucWanted - 1));
    numImp = 1 + randInt(R);
  } else {
    numImp = Math.min(cfg.numImpostors, n - ucWanted - 1);
    numImp = Math.max(1, numImp);
  }
  const numUC = Math.min(ucWanted, n - numImp - 1);

  // Palabra secreta
  const pool = wordPool();
  const chosen = rand(pool);
  const catName = (BASE_DE_DATOS.find(c => c.palabras.includes(chosen)) || {}).categoria || '?';

  const allHints = [chosen.pista1, chosen.pista2].filter(Boolean);
  let hint = null;
  if (cfg.withHints && allHints.length > 0) hint = rand(allHints);

  // Roles: reparto equilibrado. Quien fue impostor en la ronda anterior
  // conserva la misma probabilidad dividida (peso 0.35 vs 1), así puede
  // repetir pero es mucho menos probable. Siempre salen exactamente numImp.
  const lastImpostors = loadLastImpostors();
  const impostorIdx = pickImpostorsBalanced(n, numImp, lastImpostors, cfg.playerNames);
  const impostorSet = new Set(impostorIdx);
  const restOrder = shuffle([...Array(n).keys()].filter(i => !impostorSet.has(i)));
  const ucSet = new Set(restOrder.slice(0, numUC));

  const players = Array.from({ length: n }, (_, i) => ({
    id: i,
    name: (cfg.playerNames[i] || `Jugador ${i + 1}`).trim() || `Jugador ${i + 1}`,
    role: impostorSet.has(i) ? 'impostor' : (ucSet.has(i) ? 'undercover' : 'human'),
    isImpostor: impostorSet.has(i),
    isUndercover: ucSet.has(i),
    alive: true,
    leftEarly: false,
    color: colorOf(i),
    avatar: avatarOf(i)
  }));

  saveLastImpostors(players);

  // Palabras de los undercovers (distintas entre sí, misma categoría)
  const undercoverWords = {};
  if (numUC > 0) {
    const catData = BASE_DE_DATOS.find(c => c.categoria === catName);
    let otherWords = catData
      ? catData.palabras.filter(w => w.palabra !== chosen.palabra).map(w => w.palabra)
      : [];
    if (otherWords.length === 0) otherWords = [chosen.palabra];
    const picks = [];
    for (let i = 0; i < numUC; i++) picks.push(otherWords[i % otherWords.length]);
    const ucPlayers = players.filter(pl => pl.isUndercover);
    ucPlayers.forEach((pl, i) => { undercoverWords[pl.id] = picks[i]; });
  }

  STATE.game = {
    players,
    secretWord: chosen.palabra,
    category: catName,
    allHints,
    currentHint: hint,
    usedHints: hint ? [hint] : [],
    undercoverWords,
    revealOrder: [...Array(n).keys()], // respeta el orden configurado
    revealCount: 0,
    bullets: cfg.infiniteBullets ? Infinity : cfg.numBullets,
    eliminated: [],
    powersEnabled: {
      grenade: !!cfg.powers.grenade,
      shield: !!cfg.powers.shield,
      oracle: !!cfg.powers.oracle
    },
    powersUsed: { grenade: false, shield: false, oracle: false },
    starter: null
  };

  saveToStorage();
  playSound('start');
  renderRevealScreen();
  navigate('screen-reveal');
}

let holdInterval = null;
let holdProgress = 0;
const HOLD_DURATION = 800;

function startHold(e) {
  e.preventDefault();
  holdProgress = 0;
  const fill = $('hold-fill');
  if (!fill) return;
  playSound('hold');
  clearInterval(holdInterval);
  holdInterval = setInterval(() => {
    holdProgress += (50 / HOLD_DURATION) * 100;
    fill.style.width = Math.min(holdProgress, 100) + '%';
    if (holdProgress >= 100) {
      clearInterval(holdInterval);
      revealRole();
    }
  }, 50);
}

function endHold(e) {
  e.preventDefault();
  clearInterval(holdInterval);
  holdProgress = 0;
  const fill = $('hold-fill');
  if (fill) fill.style.width = '0%';
}

      <div class="body-md" style="color:var(--muted);margin-bottom:24px;">
        Se sortea una <strong>nueva palabra</strong> para la misma partida (mismos roles) y la rotación empieza de nuevo.
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <button class="btn btn-primary" onclick="redrawWord()">🎲 Nueva Palabra</button>

      </div>
    </div>
  `);
}

function redrawWord() {
  closeModal();
  const g = STATE.game;
  const pool = wordPool();
  const chosen = rand(pool);
  const catName = (BASE_DE_DATOS.find(c => c.palabras.includes(chosen)) || {}).categoria || '?';

  g.secretWord = chosen.palabra;
  g.category = catName;
  g.allHints = [chosen.pista1, chosen.pista2].filter(Boolean);
  g.currentHint = (STATE.config.withHints && g.allHints.length > 0) ? rand(g.allHints) : null;
  g.usedHints = g.currentHint ? [g.currentHint] : [];

  // Reasignar palabras de undercovers de la nueva categoría
  const ucPlayers = g.players.filter(pl => pl.isUndercover);
  if (ucPlayers.length > 0) {
    const catData = BASE_DE_DATOS.find(c => c.categoria === catName);
    let otherWords = catData
      ? catData.palabras.filter(w => w.palabra !== chosen.palabra).map(w => w.palabra)
      : [];
    if (otherWords.length === 0) otherWords = [chosen.palabra];
    ucPlayers.forEach((pl, i) => {
      g.undercoverWords[pl.id] = otherWords[i % otherWords.length];
    });
  }

  g.revealCount = 0;
  playSound('start');
  renderRevealScreen();
}

function confirmCancelRound() {

}

function confirmDeletePlayer(playerId) {

function executeDeletePlayer(playerId) {
  closeModal();
  const g = STATE.game;
  const p = g.players.find(pl => pl.id === playerId);
  if (!p || !p.alive) return;

  p.alive = false;
  p.leftEarly = true;
  g.eliminated.push(p);
  playSound('eliminate');

  afterPlayerRemoval();
}

function afterPlayerRemoval() {
  const v = checkVictory();
  if (v) {
    renderVictoryScreen(v);
    navigate('screen-victory');
    return;
  }
  const s = STATE.currentScreen;
  if (s === 'screen-reveal') renderRevealScreen();
  else if (s === 'screen-discussion') renderDiscussionScreen();
  else if (s === 'screen-voting') renderVotingScreen();
}

   ================================================================ */
function renderVotingShell() {
  return `<div class="screen" id="screen-voting"></div>`;
}

function aliveCount(g, filterFn) {
  return g.players.filter(pl => pl.alive && (!filterFn || filterFn(pl))).length;
}

function renderVotingScreen() {
  const screen = $('screen-voting');
  if (!screen) return;
  const g = STATE.game;
  if (!g) return;

  const alivePlayers = g.players.filter(pl => pl.alive);

  const bulletsDisplay = g.bullets === Infinity
    ? '<span style="color:var(--cyan)">∞</span>'
    : `<span style="${g.bullets <= 1 ? 'color:var(--red)' : 'color:var(--yellow)'}">${g.bullets}</span>`;

  const ucAlive = aliveCount(g, pl => pl.isUndercover);
  const ucChip = ucAlive > 0
    ? `<div class="stat-chip stat-chip-cyan">🎭 ${ucAlive} undercover</div>`
    : '';

  const playerRows = alivePlayers.map(pl => `
    <div class="vote-item anim-fade-up" id="vote-row-${pl.id}">
      <div style="display:flex;align-items:center;gap:12px;min-width:0;">
        <div class="player-avatar" style="background:${pl.color}22;color:${pl.color};font-size:20px;">${pl.avatar}</div>
        <div style="min-width:0;">
          <div class="body-md" style="font-weight:600;">${esc(pl.name)}</div>
          <div class="caption">En juego</div>
        </div>
      </div>
      <button class="btn btn-red btn-sm" style="width:auto;padding:10px 18px;flex-shrink:0;" onclick="confirmVote(${pl.id})">
        Votar
      </button>
    </div>
  `).join('');

  const elimRows = g.eliminated.map(pl => {
    let badge;
    if (pl.leftEarly) badge = `<span class="badge badge-left">👋 Se fue</span>`;
    else if (pl.isImpostor) badge = `<span class="badge badge-impostor">Impostor</span>`;
    else if (pl.isUndercover) badge = `<span class="badge badge-undercover">Undercover</span>`;
    else badge = `<span class="badge badge-human">Inocente</span>`;
    return `
    <div class="vote-item" style="opacity:0.45;">
      <div style="display:flex;align-items:center;gap:12px;min-width:0;">
        <div class="player-avatar" style="background:${pl.color}22;color:${pl.color};font-size:20px;filter:grayscale(0.7);">${pl.avatar}</div>
        <div style="min-width:0;">
          <div class="body-md" style="font-weight:600;text-decoration:line-through;">${esc(pl.name)}</div>
        </div>
      </div>
      ${badge}
    </div>`;
  }).join('');

  const grenadeBtn = (g.powersEnabled.grenade && !g.powersUsed.grenade)
    ? `<button class="btn btn-power" onclick="useGrenade()">💥 Poder: Granada</button>`
    : '';
  const oracleBtn = (g.powersEnabled.oracle && !g.powersUsed.oracle)
    ? `<button class="btn btn-power btn-oracle" onclick="useOracle()">🔮 Poder: El Oráculo</button>`
    : '';
  const hasPowers = grenadeBtn || oracleBtn;

  screen.innerHTML = `
    <div class="screen-header">
      <div style="flex:1;">
        <div class="title-lg">Votación</div>
        <div class="caption">Elijan a quién sacar de la partida</div>
      </div>
    </div>

    <div class="stat-chips">
      <div class="stat-chip stat-chip-red">🔫 ${bulletsDisplay} balas</div>
      <div class="stat-chip stat-chip-blue">🕵️ ${aliveCount(g, pl => pl.isImpostor)} impostores</div>
      <div class="stat-chip stat-chip-green">✅ ${aliveCount(g, pl => !pl.isImpostor && !pl.isUndercover)} inocentes</div>
      ${ucChip}
    </div>

    <div class="scroll-area">
      <div class="section-label" style="margin-top:0;">Jugadores vivos</div>
      <div id="alive-list">${playerRows}</div>

      ${g.eliminated.length > 0 ? `
        <div class="divider"></div>
        <div class="section-label">Fuera de la partida</div>
        <div id="elim-list">${elimRows}</div>
      ` : ''}

      <div style="height:16px;"></div>
    </div>

    <div class="screen-footer">
      ${hasPowers ? `<div class="controls-row">${grenadeBtn}${oracleBtn}</div>` : ''}

        <button class="btn btn-danger-ghost btn-sm" onclick="confirmCancelRound()">✖️ Cancelar ronda</button>

}

function useShield(playerId) {

function closeModalAndBackToVote() {

}

function executeVote(playerId) {
  closeModal();
  const g = STATE.game;
  const p = g.players.find(pl => pl.id === playerId);
  if (!p || !p.alive) return;

  p.alive = false;
  g.eliminated.push(p);
  playSound('eliminate');
  vibrate(120);

  if (p.isUndercover) {
    if (g.bullets !== Infinity) g.bullets--;
    // Última oportunidad del undercover: adivinar la palabra real
    openModal(`
      <div style="text-align:center;">
        <div style="font-size:48px;margin-bottom:12px;">🎭</div>
        <div class="title-md" style="color:var(--cyan);margin-bottom:8px;">${esc(p.name)} era el Undercover</div>
        <div class="body-md" style="color:var(--muted);margin-bottom:6px;">Su palabra era: <strong style="color:var(--cyan)">${esc(g.undercoverWords[p.id] || '?')}</strong></div>
        <div class="body-md" style="margin-bottom:20px;">¿Puede adivinar la palabra real antes de caer?</div>
        <div style="padding:16px;background:rgba(0,245,255,0.06);border:1px solid rgba(0,245,255,0.2);border-radius:var(--radius-sm);margin-bottom:24px;">
          <div class="caption" style="margin-bottom:4px;text-transform:uppercase;letter-spacing:0.1em;">Categoría</div>
          <div class="body-md" style="color:var(--cyan);font-weight:700;">${esc(g.category)}</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px;">
          <button class="btn btn-primary" onclick="undercoverGuessResult(true, ${p.id})" style="background:linear-gradient(135deg,var(--cyan),var(--blue));">✅ ¡Adivinó la palabra!</button>
          <button class="btn btn-red" onclick="undercoverGuessResult(false, ${p.id})">❌ No adivinó</button>
        </div>
      </div>
    `);
    return;
  }

  if (!p.isImpostor) {
    // Inocente eliminado por votación: se gasta una bala
    if (g.bullets !== Infinity) g.bullets--;
  }

  const v = checkVictory();
  if (v) {
    renderVictoryScreen(v);
    navigate('screen-victory');
    return;
  }

  renderVotingScreen();
}

function undercoverGuessResult(guessed, playerId) {
  closeModal();
  const g = STATE.game;
  const guesser = g.players.find(pl => pl.id === playerId);

  if (guessed) {
    playSound('victory');
    renderVictoryScreen({
      winner: 'undercover',
      reason: '¡Adivinó la palabra secreta al ser eliminado!',
      guesser
    });
    navigate('screen-victory');
    return;
  }

  playSound('eliminate');
  const v = checkVictory();
  if (v) {
    renderVictoryScreen(v);
    navigate('screen-victory');
    return;
  }
  renderVotingScreen();
}

/* ================================================================
   PODERES (una vez por partida)
   ================================================================ */
function useGrenade() {
  const g = STATE.game;
  if (!g.powersEnabled.grenade || g.powersUsed.grenade) return;
  playSound('tap');

  openModal(`
    <div style="text-align:center;">
      <div style="font-size:48px;margin-bottom:12px;">💥</div>
      <div class="title-md" style="margin-bottom:8px;">¿Lanzar la Granada?</div>
      <div class="body-md" style="color:var(--muted);margin-bottom:20px;">
        Resultado totalmente aleatorio. Solo se puede usar <strong>una vez</strong> en toda la partida.
      </div>
      <div class="info-note" style="text-align:left;margin-bottom:24px;">
        💣 50% · 2 inocentes + 1 impostor/undercover<br>
        😬 49% · 3 inocentes<br>
        🍀 1% · 2 impostores
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <button class="btn btn-red" onclick="launchGrenade()">💥 Lanzar</button>
        <button class="btn btn-ghost" onclick="closeModal()">Mejor no</button>
      </div>
    </div>
  `);
}

function launchGrenade() {
  const g = STATE.game;
  g.powersUsed.grenade = true;

  const roll = Math.random() * 100;
  const aliveInnocents = g.players.filter(pl => pl.alive && !pl.isImpostor);
  const aliveImpostors = g.players.filter(pl => pl.alive && pl.isImpostor);
  const impSide = g.players.filter(pl => pl.alive && (pl.isImpostor || pl.isUndercover));

  let victims = [];
  let title, subtitle, emoji;

  if (roll < 1) {
    emoji = '🍀';
    title = '¡MILAGRO!';
    subtitle = 'La granada cayó del lado bueno…';
    victims = pickRandom(aliveImpostors, 2);
  } else if (roll < 50) {
    emoji = '😬';
    title = 'KA-BOOM';
    subtitle = 'La explosión alcanzó solo a inocentes…';
    victims = pickRandom(aliveInnocents, 3);
  } else {
    emoji = '💥';
    title = 'KA-BOOM';
    subtitle = 'La explosión alcanzó a inocentes y a un infiltrado.';
    victims = [
      ...pickRandom(aliveInnocents, 2),
      ...pickRandom(impSide, 1)
    ];
    // Seguridad: evitar duplicados (poco probable pero posible en grupos chicos)
    const seen = new Set();
    victims = victims.filter(v => !seen.has(v.id) && seen.add(v.id));
  }

  victims.forEach(v => {
    v.alive = false;
    g.eliminated.push(v);
  });

  playSound('explosion');
  vibrate([120, 60, 220]);

  const flash = document.createElement('div');
  flash.className = 'explosion-flash';
  document.body.appendChild(flash);
  setTimeout(() => flash.remove(), 900);
  document.body.classList.add('shake');
  setTimeout(() => document.body.classList.remove('shake'), 600);

  const victimRows = victims.length > 0
    ? victims.map(pl => {
        let badge;
        if (pl.isImpostor) badge = `<span class="badge badge-impostor">Impostor</span>`;
        else if (pl.isUndercover) badge = `<span class="badge badge-undercover">Undercover</span>`;
        else badge = `<span class="badge badge-human">Inocente</span>`;
        return `
        <div class="vote-item" style="opacity:0.85;">
          <div style="display:flex;align-items:center;gap:12px;min-width:0;">
            <div class="player-avatar" style="background:${pl.color}22;color:${pl.color};font-size:20px;filter:grayscale(0.7);">${pl.avatar}</div>
            <div class="body-md" style="font-weight:600;">${esc(pl.name)}</div>
          </div>
          ${badge}
        </div>`;
      }).join('')
    : `<div class="body-md" style="color:var(--muted);padding:12px;">Nadie… de pura suerte.</div>`;

  openModal(`
    <div style="text-align:center;">
      <div class="anim-scale" style="font-size:64px;margin-bottom:12px;">${emoji}</div>
      <div class="title-xl glow-red" style="margin-bottom:8px;">${title}</div>
      <div class="body-md" style="color:var(--muted);margin-bottom:20px;">${subtitle}</div>
      <div style="text-align:left;margin-bottom:24px;">${victimRows}</div>
      <button class="btn btn-primary" onclick="grenadeDone()">Continuar</button>
    </div>
  `);
}

function grenadeDone() {
  closeModal();
  const v = checkVictory();
  if (v) {
    renderVictoryScreen(v);
    navigate('screen-victory');
    return;
  }
  renderVotingScreen();
}

function useOracle() {
  const g = STATE.game;
  if (!g.powersEnabled.oracle || g.powersUsed.oracle) return;
  g.powersUsed.oracle = true;
  playSound('oracle');

  const remaining = g.allHints.filter(h => !g.usedHints.includes(h));
  let revealText;
  if (remaining.length > 0) {
    const hint = rand(remaining);
    g.usedHints.push(hint);
    revealText = esc(hint);
  } else {
    const w = g.secretWord;
    revealText = `Empieza con <strong style="color:var(--violet)">"${esc(w[0])}"</strong> y tiene <strong style="color:var(--violet)">${w.length} letras</strong>`;
  }

  openModal(`
    <div style="text-align:center;">
      <div class="anim-scale" style="font-size:56px;margin-bottom:12px;">🔮</div>
      <div class="title-md glow-violet" style="margin-bottom:8px;">El Oráculo habla</div>
      <div class="body-md" style="color:var(--muted);margin-bottom:16px;">Pista extra sobre la palabra secreta:</div>
      <div class="card-glass" style="border-color:rgba(168,85,247,0.4);margin-bottom:16px;">
        <div class="title-lg glow-violet">${revealText}</div>
        <div class="caption" style="margin-top:8px;">Categoría: ${esc(g.category)}</div>
      </div>
      <div class="info-note" style="margin-bottom:20px;">Toda la sala escucha esta pista… incluido el impostor.</div>
      <button class="btn btn-primary" onclick="closeModal()">Continuar</button>
    </div>
  `);
}

/* ================================================================
   CONDICIONES DE VICTORIA (simplificadas)
   ================================================================ */
function checkVictory() {
  const g = STATE.game;
  if (!g) return null;

  // 1) Sin balas: ganan los impostores
  if (g.bullets !== Infinity && g.bullets <= 0) {
    return { winner: 'impostors', reason: 'Se agotaron todas las balas 🔫' };
  }

  // 2) Sin inocentes vivos: ganan los impostores
  const innocentsAlive = g.players.filter(pl => pl.alive && !pl.isImpostor).length;
  if (innocentsAlive === 0) {
    return { winner: 'impostors', reason: 'No queda ningún inocente con vida 😈' };
  }

  // 3) Sin impostores vivos: ganan los inocentes
  const impostorsAlive = g.players.filter(pl => pl.alive && pl.isImpostor).length;
  if (impostorsAlive === 0) {
    return { winner: 'humans', reason: 'Eliminaron a todos los impostores 🎯' };
  }

  return null;
}

/* ================================================================
   6. VICTORIA
   ================================================================ */
function renderVictoryShell() {
  return `<div class="screen" id="screen-victory"></div>`;
}

function renderVictoryScreen(result) {
  const screen = $('screen-victory');
  if (!screen) return;
  const g = STATE.game;

  const undercoverWin = result.winner === 'undercover';
  const humansWin = result.winner === 'humans';

  let color, glow, emoji, title, btnClass;
  if (undercoverWin) {
    color = 'var(--cyan)'; glow = 'glow-cyan'; emoji = '🎭'; title = '¡UNDERCOVER GANA!';
    btnClass = '';
  } else if (humansWin) {
    color = 'var(--green)'; glow = 'glow-green'; emoji = '🏆'; title = '¡INOCENTES GANAN!';
    btnClass = 'btn-green';
  } else {
    color = 'var(--red)'; glow = 'glow-red'; emoji = '👿'; title = '¡IMPOSTORES GANAN!';
    btnClass = 'btn-red';
  }

  if (humansWin) playSound('victory');
  else if (undercoverWin) { playSound('reveal'); setTimeout(() => playSound('victory'), 300); }
  else playSound('impostorWin');

  const impostors = g.players.filter(pl => pl.isImpostor);
  const undercovers = g.players.filter(pl => pl.isUndercover);
  const leftEarly = g.players.filter(pl => pl.leftEarly);

  const impostorList = impostors.map(pl => `
    <div class="player-item" style="border-color:${humansWin ? 'rgba(57,255,20,0.2)' : 'rgba(255,49,49,0.2)'};">
      <div class="player-avatar" style="background:${pl.color}22;color:${pl.color};font-size:20px;">${pl.avatar}</div>
      <div style="flex:1;min-width:0;">
        <div class="body-md" style="font-weight:700;">${esc(pl.name)}</div>
        <div class="caption">${pl.alive ? 'Sobrevivió' : 'Fue eliminado'}</div>
      </div>
      <span class="badge badge-impostor">IMPOSTOR</span>
    </div>
  `).join('');

  const undercoverList = undercovers.map(pl => `
    <div class="player-item" style="border-color:rgba(0,245,255,0.2);">
      <div class="player-avatar" style="background:${pl.color}22;color:${pl.color};font-size:20px;">${pl.avatar}</div>
      <div style="flex:1;min-width:0;">
        <div class="body-md" style="font-weight:700;">${esc(pl.name)}</div>
        <div class="caption">Su palabra: <strong style="color:var(--cyan)">${esc(g.undercoverWords[pl.id] || '?')}</strong></div>
      </div>
      <span class="badge badge-undercover">UNDERCOVER</span>
    </div>
  `).join('');

  const leftList = leftEarly.map(pl => `
    <div class="player-item" style="border-color:var(--border);opacity:0.6;">
      <div class="player-avatar" style="background:${pl.color}22;color:${pl.color};font-size:20px;">${pl.avatar}</div>
      <div style="flex:1;min-width:0;">
        <div class="body-md" style="font-weight:700;">${esc(pl.name)}</div>
      </div>
      <span class="badge badge-left">👋 ${pl.isImpostor ? 'Impostor' : pl.isUndercover ? 'Undercover' : 'Inocente'}</span>
    </div>
  `).join('');

  const guesserNote = result.guesser
    ? `<div class="caption" style="margin-top:8px;">🎉 Lo logró: <strong style="color:${result.guesser.color}">${esc(result.guesser.name)}</strong></div>`
    : '';

  const particleColor = undercoverWin ? 'var(--cyan)' : humansWin ? 'var(--green)' : 'var(--red)';
  const particles = Array.from({ length: 20 }, () => `
    <div class="victory-particle" style="
      left:${Math.random() * 100}%;
      background:${particleColor};
      animation-duration:${2 + Math.random() * 3}s;
      animation-delay:${Math.random() * 2}s;
      width:${2 + Math.random() * 4}px;
      height:${2 + Math.random() * 4}px;
    "></div>
  `).join('');

  screen.innerHTML = `
    <div class="victory-bg">${particles}</div>

    <div class="scroll-area" style="display:flex;flex-direction:column;justify-content:center;padding-top:24px;">
      <div class="anim-scale" style="text-align:center;">
        <div style="font-size:72px;margin-bottom:16px;filter:drop-shadow(0 0 30px ${color});">${emoji}</div>
      </div>
      <div class="anim-fade-up delay-1" style="text-align:center;">
        <div class="title-xl ${glow}" style="margin-bottom:8px;">${title}</div>
        <div class="body-md" style="color:var(--muted);margin-bottom:4px;">${esc(result.reason)}</div>
        <div class="caption">Palabra secreta: <strong style="color:${color}">${esc(g.secretWord)}</strong></div>
        ${guesserNote}
      </div>

      <div class="anim-fade-up delay-2" style="width:100%;margin-top:28px;">
        ${impostors.length > 0 ? `
          <div class="section-label">Los Impostores eran</div>
          <div>${impostorList}</div>
        ` : ''}
        ${undercovers.length > 0 ? `
          <div class="section-label">Los Undercovers eran</div>
          <div>${undercoverList}</div>
        ` : ''}
        ${leftEarly.length > 0 ? `
          <div class="section-label">Se fueron de la partida</div>
          <div>${leftList}</div>
        ` : ''}
      </div>
      <div style="height:16px;"></div>
    </div>

    <div class="screen-footer">
      <button class="btn ${btnClass} anim-fade-up delay-3" onclick="playAgain()">
        🔄 Otra Partida
      </button>
      <button class="btn btn-ghost btn-sm" onclick="backToConfig()">⚙️ Configuración</button>
    </div>
  `;
}

function playAgain() {
  startGame();
}

function backToConfig() {
  navigate('screen-config');
  syncConfigUI();
}

/* ================================================================
   INIT
   ================================================================ */
document.addEventListener('DOMContentLoaded', () => {
  loadFromStorage();
  renderApp();
  setupPwaManifest();
  tryRegisterServiceWorker();
});

let lastTouch = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouch < 300) e.preventDefault();
  lastTouch = now;
}, { passive: false });

document.addEventListener('touchmove', e => {
  if (!e.target.closest('.scroll-area')) {
    e.preventDefault();
  }
}, { passive: false });

document.addEventListener('touchstart', () => initAudio(), { once: true });
document.addEventListener('click', () => initAudio(), { once: true });

</script>
</body>
</html>
